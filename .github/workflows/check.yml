name: Check pose camera

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      # Runs the setup action from this commit.
      - name: Install dependencies
        uses: $/.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4.0.4

      # Runs the setup action from this commit.
      - name: Install dependencies
        uses: $/.github/actions/setup

      - name: Create a temporary app
        run: pnpm create expo-app "$RUNNER_TEMP/pose-check" --template blank@sdk-58 --yes --no-agents-md

      - name: Install this library
        working-directory: ${{ runner.temp }}/pose-check
        env:
          LIBRARY_DIRECTORY: ${{ github.workspace }}
        run: |
          if [ -z "$LIBRARY_DIRECTORY" ]; then
            echo "LIBRARY_DIRECTORY is empty"
            exit 1
          fi
          pnpm add "link:$LIBRARY_DIRECTORY" react-native-svg@15.16.1

      - name: Prebuild Android
        working-directory: ${{ runner.temp }}/pose-check
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Test and assemble
        working-directory: ${{ runner.temp }}/pose-check/android
        run: ./gradlew :yosefsabag-mediapipe-pose:testDebugUnitTest :app:assembleDebug --console=plain
