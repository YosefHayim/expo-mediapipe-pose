name: Check pose camera

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Create a temporary app
        run: pnpm create expo-app "$RUNNER_TEMP/pose-check" --template blank@sdk-58 --yes --no-agents-md

      - name: Install this library
        working-directory: ${{ runner.temp }}/pose-check
        env:
          LIBRARY_DIRECTORY: ${{ github.workspace }}
        run: |
          if [ -z "$LIBRARY_DIRECTORY" ]; then
            echo "LIBRARY_DIRECTORY is empty"
            exit 1
          fi
          pnpm add "link:$LIBRARY_DIRECTORY" react-native-svg@15.16.1

      - name: Prebuild Android
        working-directory: ${{ runner.temp }}/pose-check
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Test and assemble
        working-directory: ${{ runner.temp }}/pose-check/android
        run: ./gradlew :expo-mediapipe-pose:testDebugUnitTest :app:assembleDebug --console=plain

  gate:
    name: CI Gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
      - test
      - android
    if: always()
    steps:
      - name: Require every check to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
