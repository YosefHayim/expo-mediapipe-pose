name: Pose playground Pages
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - run: pnpm --filter pose-playground build
      - run: pnpm --filter pose-playground exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter pose-playground test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playground-browser-failures
          path: playground/test-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: playground/dist
    timeout-minutes: 15
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
    timeout-minutes: 15
