name: Setup
description: Install Node, pnpm, and the dependencies.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24

    - name: Install dependencies
      shell: bash
      run: pnpm install
